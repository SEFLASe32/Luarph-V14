name: CI — Encoder Verification & Web Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Luraph-Style Encoder & Round-Trip Verification Suite
        run: |
          node encoder.mjs input.lua output_encoded.lua
          node test-compare.mjs

      - name: Install Dependencies (Web Workbench)
        run: npm ci

      - name: TypeScript Lint Check
        run: npm run lint

      - name: Production Build
        run: npm run build
